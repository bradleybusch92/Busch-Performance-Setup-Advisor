<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Abstraction Owner's Manual</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#161616;color:#f2f2f2;font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#161616;z-index:20}.card{width:min(430px,100%);padding:16px;border:1px solid #3a3a3a;border-radius:12px;background:#1b1b1b}.card h3{margin:0 0 10px}.card input,.card button{width:100%;margin-top:8px;min-height:40px;border:1px solid #444;border-radius:8px;padding:8px;background:#222;color:#f2f2f2;font:inherit}.card input{font-size:16px}.card button.primary{background:#d9d9d9;color:#111;font-weight:800}.status{margin-top:10px;color:#aaa;font-size:12px}.hidden{display:none!important}#appFrame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#161616;display:none}
</style></head><body>
<div id="loading" class="stage"><div class="card"><h3>Abstraction Owner's Manual</h3><div id="loadStatus">Loading current cloud data…</div></div></div>
<div id="login" class="stage hidden"><div class="card"><h3>Abstraction Owner's Manual</h3><input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Email or Username"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn" class="primary" type="button">Sign In</button><button id="signUp" type="button">Create Account</button><div id="status" class="status"></div></div></div>
<iframe id="appFrame" title="Abstraction Owner's Manual"></iframe>
<script>
(async()=>{
'use strict';
const B_URL='https://gjlhegrcmaclikeoeonh.supabase.co';
const B_KEY='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9';
const B_STATE_KEY='abstractionOwnersManualWebV1';
const B_VER='20261009-vendor-index-v38';
const DISPLAY_VERSION='v2026.10.09.38';
const g=id=>document.getElementById(id);
const bc=window.supabase.createClient(B_URL,B_KEY);
const clone=x=>JSON.parse(JSON.stringify(x));
const cssFiles=['cloud-enhance.css','cloud-advisor.css','cloud-account.css','cloud-desktop.css','cloud-desktop-tune.css','cloud-copy-component.css','cloud-desktop-flat-v18.css','cloud-mobile-flat-v19.css','cloud-ui-v22.css','cloud-ui-v24.css','cloud-ui-v25.css','cloud-ui-v26.css','cloud-ui-v27.css','cloud-ui-v28.css','cloud-ui-v29.css','cloud-ui-v30.css','cloud-ui-v31.css','cloud-ui-v33.css','cloud-ui-v34.css','cloud-ui-v35.css'];
const jsFiles=['cloud-authoritative-v17.js','cloud-sync-pre.js','cloud-enhance.js','cloud-advisor.js','cloud-engine.js','cloud-account.js','cloud-login-ui.js','cloud-desktop.js','cloud-desktop-tune.js','cloud-copy-component.js','cloud-purchase-v31.js','cloud-sync-v17.js','cloud-save-bridge-v17.js','cloud-purchase-save-v32.js','cloud-purchase-save-v33.js','cloud-purchase-quick-v34.js','cloud-index-v35.js','cloud-index-v38.js','cloud-export-package-v37.js'];
function showLoading(msg){g('loadStatus').textContent=msg;g('loading').classList.remove('hidden');g('login').classList.add('hidden')}
function showLogin(){g('loading').classList.add('hidden');g('login').classList.remove('hidden')}
async function freshCloudState(sess){
 const r=await fetch(B_URL+'/rest/v1/rpc/get_owner_manual_state',{method:'POST',cache:'no-store',headers:{apikey:B_KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json',Accept:'application/json','Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'},body:'{}'});
 if(!r.ok)throw new Error('Cloud load failed: '+r.status);
 const rows=await r.json();return rows[0]||null;
}
function addStyle(doc,href){const l=doc.createElement('link');l.rel='stylesheet';l.href=href+'?v='+encodeURIComponent(B_VER);doc.head.appendChild(l)}
function addScript(doc,src){return new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src+(src.includes('-v17.js')?'':'?v='+encodeURIComponent(B_VER));s.onload=resolve;s.onerror=()=>reject(new Error('Could not load '+src));doc.body.appendChild(s)})}
function applyPresentationLabels(doc){
 const indexBtn=doc.querySelector('#cloudTopNav button[data-page="index"]');if(indexBtn)indexBtn.textContent='Index';
 const advisorBtn=doc.getElementById('cloudSetupAdvisorTab');if(advisorBtn)advisorBtn.textContent='Advisor';
 const generalCar=doc.querySelector('#home .zone[data-area="General Setup"]');if(generalCar)generalCar.textContent='General';
 const generalRail=doc.querySelector('.cloudDesktopAreaBtn[data-area="General Setup"]');if(generalRail)generalRail.textContent='General';
}
function lockDisplayedVersion(doc){
 let version=doc.getElementById('cloudVersion');
 if(version){version.textContent=DISPLAY_VERSION;version.id='cloudVersionLockedV38';return}
 version=doc.getElementById('cloudVersionLockedV38');
 if(version){version.textContent=DISPLAY_VERSION;return}
 const el=doc.createElement('div');el.id='cloudVersionLockedV38';el.className='cloudVersion';el.textContent=DISPLAY_VERSION;doc.body.appendChild(el);
}
async function launch(sess){
 showLoading('Loading current cloud data…');
 let row;
 try{row=await freshCloudState(sess)}catch(e){console.warn(e);g('loadStatus').textContent='Could not load current cloud data. Reload this page to retry.';return}
 const bootState=row?.state||null,updatedAt=row?.updated_at||'';
 if(!bootState){g('loadStatus').textContent='No cloud Owner\'s Manual state was found.';return}
 localStorage.setItem(B_STATE_KEY,JSON.stringify(bootState));
 showLoading('Opening Owner\'s Manual…');
 const frame=g('appFrame');frame.style.display='block';
 frame.onload=async()=>{
   try{
     const w=frame.contentWindow,doc=frame.contentDocument;
     w.__ABSTRACTION_CLOUD_BOOT=clone(bootState);
     w.__ABSTRACTION_CLOUD_UPDATED_AT=updatedAt;
     cssFiles.forEach(f=>addStyle(doc,f));
     const sup=doc.createElement('script');
     await new Promise((resolve,reject)=>{sup.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sup.onload=resolve;sup.onerror=()=>reject(new Error('Supabase library failed inside app'));doc.head.appendChild(sup)});
     for(const f of jsFiles)await addScript(doc,f);
     applyPresentationLabels(doc);lockDisplayedVersion(doc);
     setTimeout(()=>applyPresentationLabels(doc),350);setTimeout(()=>applyPresentationLabels(doc),900);
     g('loading').classList.add('hidden');
   }catch(e){console.error(e);frame.style.display='none';g('loadStatus').textContent='App shell loaded, but an enhancement file failed: '+e.message;g('loading').classList.remove('hidden')}
 };
 frame.src='index.html?cloudv38='+Date.now();
}
async function signIn(){
 const identifier=g('email').value.trim(),password=g('password').value;if(!identifier||!password){g('status').textContent='Enter your email or username and password.';return}
 g('status').textContent='Signing in…';
 try{
   let session=null;
   if(identifier.includes('@')){const {data,error}=await bc.auth.signInWithPassword({email:identifier,password});if(error)throw error;session=data.session}
   else{const r=await fetch(B_URL+'/functions/v1/owner-manual-login',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',apikey:B_KEY,Authorization:'Bearer '+B_KEY},body:JSON.stringify({identifier,password})});const x=await r.json().catch(()=>({}));if(!r.ok||!x.access_token||!x.refresh_token)throw new Error(x.error||'Invalid login credentials');const {data,error}=await bc.auth.setSession({access_token:x.access_token,refresh_token:x.refresh_token});if(error)throw error;session=data.session}
   if(!session)throw new Error('Invalid login credentials');await launch(session)
 }catch(e){console.warn(e);g('status').textContent='Invalid email/username or password.'}
}
g('signIn').onclick=signIn;g('password').onkeydown=e=>{if(e.key==='Enter')signIn()};
g('signUp').onclick=async()=>{const email=g('email').value.trim();if(!email.includes('@')){g('status').textContent='Use your email address to create a new account.';return}g('status').textContent='Creating account…';const {data,error}=await bc.auth.signUp({email,password:g('password').value,options:{emailRedirectTo:location.origin+location.pathname}});if(error){g('status').textContent=error.message;return}if(data.session)launch(data.session);else g('status').textContent='Confirm your email, then sign in.'};
const {data}=await bc.auth.getSession();if(data.session)launch(data.session);else showLogin();
})();
</script></body></html>
