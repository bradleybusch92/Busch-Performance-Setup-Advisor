<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Abstraction Owner's Manual</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b0e;color:#f3f5f7;font:14px/1.4 Arial,sans-serif}.boot{padding:24px;color:#a6adb6}.login{width:min(430px,calc(100% - 28px));margin:56px auto 0;padding:14px;border:1px solid #353b44;border-radius:12px;background:#13161a}.login h3{margin:0 0 10px}.login input,.login button{width:100%;margin-top:8px;min-height:38px;border:1px solid #353b44;border-radius:8px;padding:8px;background:#1a1e23;color:#f3f5f7;font:inherit}.login input{font-size:16px}.login button.primary{background:#eceff2;color:#111418;font-weight:800}.status{margin-top:9px;color:#a6adb6;font-size:12px}
</style></head><body>
<div id="bootMsg" class="boot">Loading cloud data…</div>
<div id="login" class="login" style="display:none"><h3>Abstraction Owner's Manual</h3><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn" class="primary" type="button">Sign In</button><button id="signUp" type="button">Create Account</button><div id="status" class="status"></div></div>
<script>
(async()=>{
'use strict';
const B_URL='https://gjlhegrcmaclikeoeonh.supabase.co',B_KEY='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9',B_STATE_KEY='abstractionOwnersManualWebV1',B_VER='20260929-2145-v9';
const g=id=>document.getElementById(id);
const bc=window.supabase.createClient(B_URL,B_KEY);
async function launch(sess){
  g('bootMsg').style.display='block';g('login').style.display='none';
  try{
    const {data,error}=await bc.from('owner_manuals').select('state,updated_at').eq('user_id',sess.user.id).maybeSingle();
    if(!error&&data?.state)localStorage.setItem(B_STATE_KEY,JSON.stringify(data.state));
  }catch(e){}
  try{
    const r=await fetch('index.html?v='+B_VER+'&t='+Date.now(),{cache:'no-store',credentials:'same-origin'});
    let h=await r.text();
    h=h.replace('</head>','<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script><link rel="stylesheet" href="cloud-enhance.css?v='+B_VER+'"></head>');
    h=h.replace('</body>','<script src="cloud-enhance.js?v='+B_VER+'"><\/script></body>');
    document.open();document.write(h);document.close();
  }catch(e){g('bootMsg').textContent="Could not load the Owner's Manual. Refresh and try again."}
}
async function showLogin(){g('bootMsg').style.display='none';g('login').style.display='block'}
g('signIn').onclick=async()=>{g('status').textContent='Signing in…';const {data,error}=await bc.auth.signInWithPassword({email:g('email').value.trim(),password:g('password').value});if(error){g('status').textContent=error.message;return}launch(data.session)};
g('password').onkeydown=e=>{if(e.key==='Enter')g('signIn').click()};
g('signUp').onclick=async()=>{g('status').textContent='Creating account…';const {data,error}=await bc.auth.signUp({email:g('email').value.trim(),password:g('password').value,options:{emailRedirectTo:location.origin+location.pathname}});if(error){g('status').textContent=error.message;return}if(data.session)launch(data.session);else g('status').textContent='Confirm your email, then sign in.'};
const {data}=await bc.auth.getSession();if(data.session)launch(data.session);else showLogin();
})();
</script></body></html>
