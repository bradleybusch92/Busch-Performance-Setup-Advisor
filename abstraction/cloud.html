<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0e"><title>Abstraction Owner's Manual - Cloud Sync</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#090b0e;--panel:#13161a;--line:#353b44;--text:#f3f5f7;--muted:#a6adb6;--ok:#9bd5a5;--warn:#e2cb72;--bad:#ef9a9a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#101318;border-bottom:1px solid var(--line)}.brand{font-weight:800}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}button,input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#1a1e23;color:var(--text)}button{cursor:pointer;touch-action:manipulation}.primary{background:#eceff2;color:#111418;border-color:#eceff2;font-weight:800}.auth{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.auth input{width:210px}.email{font-size:12px;color:#d5dbe1}.frame{width:100%;height:calc(100vh - 59px);border:0;display:block;background:#090b0e}.toast{position:fixed;right:14px;bottom:14px;z-index:50;background:#11151a;border:1px solid #58616c;padding:10px 13px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;max-width:min(420px,calc(100vw - 28px))}.toast.show{opacity:1}@media(max-width:720px){.bar{align-items:stretch}.spacer{display:none}.auth{width:100%}.auth input{flex:1;min-width:0}.frame{height:calc(100vh - 117px)}}@media(max-width:480px){.auth input{width:100%;flex-basis:100%}.frame{height:calc(100vh - 157px)}}</style></head><body><div class="bar"><div class="brand">Abstraction Owner's Manual</div><div id="syncStatus" class="status warn">Local mode</div><div class="spacer"></div><div id="signedIn" class="auth" style="display:none"><span id="userEmail" class="email"></span><button id="syncNow">Sync Now</button><button id="signOut">Sign Out</button></div><div id="signedOut" class="auth"><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signIn" class="primary">Sign In</button><button id="signUp">Create Account</button></div></div><iframe id="app" class="frame" src="index.html" title="Abstraction Owner's Manual"></iframe><div id="toast" class="toast"></div><script>const SB_URL='https://gjlhegrcmaclikeoeonh.supabase.co';const SB_KEY='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9';const APP_KEY='abstractionOwnersManualWebV1';const supabase=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);let session=null,lastLocal=null,lastRemoteUpdated=null,pushing=false,pullTimer=null,pollTimer=null;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function status(msg,cls=''){$('syncStatus').textContent=msg;$('syncStatus').className='status '+cls}function frameStorage(){try{return $('app').contentWindow.localStorage}catch(e){return null}}function getLocalRaw(){const s=frameStorage();return s?s.getItem(APP_KEY):null}function setLocalRaw(raw){const s=frameStorage();if(!s)return false;s.setItem(APP_KEY,raw);return true}function showAuth(){if(session){$('signedOut').style.display='none';$('signedIn').style.display='flex';$('userEmail').textContent=session.user.email||'Signed in'}else{$('signedOut').style.display='flex';$('signedIn').style.display='none';status('Local mode','warn')}}async function initialSync(){if(!session)return;status('Checking cloud…','warn');const {data,error}=await supabase.from('owner_manuals').select('state,updated_at').eq('user_id',session.user.id).maybeSingle();if(error){status('Cloud error','bad');toast(error.message);return}const localRaw=getLocalRaw();if(data&&data.state){const cloudRaw=JSON.stringify(data.state);lastRemoteUpdated=data.updated_at;lastLocal=cloudRaw;if(localRaw!==cloudRaw){setLocalRaw(cloudRaw);$('app').contentWindow.location.reload();}status('Synced','ok')}else if(localRaw){await pushRaw(localRaw,true)}else{status('Nothing to sync yet','warn')}}async function pushRaw(raw,force=false){if(!session||!raw||pushing)return;if(!force&&raw===lastLocal)return;pushing=true;status('Saving…','warn');let state;try{state=JSON.parse(raw)}catch(e){pushing=false;status('Local data error','bad');return}const {data,error}=await supabase.from('owner_manuals').upsert({user_id:session.user.id,state},{onConflict:'user_id'}).select('updated_at').single();pushing=false;if(error){status('Save failed','bad');toast(error.message);return}lastLocal=raw;lastRemoteUpdated=data.updated_at;status('Synced','ok')}async function checkRemote(){if(!session||pushing)return;const {data,error}=await supabase.from('owner_manuals').select('state,updated_at').eq('user_id',session.user.id).maybeSingle();if(error)return;if(!data)return;if(lastRemoteUpdated&&data.updated_at===lastRemoteUpdated)return;const remoteRaw=JSON.stringify(data.state);const localRaw=getLocalRaw();if(localRaw&&lastLocal&&localRaw!==lastLocal){await pushRaw(localRaw);return}lastRemoteUpdated=data.updated_at;lastLocal=remoteRaw;if(localRaw!==remoteRaw){setLocalRaw(remoteRaw);$('app').contentWindow.location.reload();toast('Updated from cloud')}status('Synced','ok')}function startWatch(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!session)return;const raw=getLocalRaw();if(raw&&raw!==lastLocal){clearTimeout(pullTimer);pullTimer=setTimeout(()=>pushRaw(raw),600)}},700);setInterval(checkRemote,5000)}$('app').addEventListener('load',()=>{if(session)initialSync()});$('signIn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('Enter email and password');status('Signing in…','warn');const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){status('Sign in failed','bad');return toast(error.message)}session=data.session;showAuth();await initialSync()};$('signUp').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return toast('Enter email and password');if(password.length<6)return toast('Password must be at least 6 characters');status('Creating account…','warn');const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(error){status('Account setup failed','bad');return toast(error.message)}if(data.session){session=data.session;showAuth();await initialSync();toast('Account created and sync is on')}else{status('Check your email','warn');toast('Account created. Confirm the email, then come back and sign in.')}};$('signOut').onclick=async()=>{await supabase.auth.signOut();session=null;lastLocal=null;lastRemoteUpdated=null;showAuth();toast('Signed out. Local copy remains on this device.')};$('syncNow').onclick=async()=>{const raw=getLocalRaw();if(raw)await pushRaw(raw,true);await checkRemote()};supabase.auth.onAuthStateChange(async(event,newSession)=>{session=newSession;showAuth();if(session&&$('app').contentWindow?.document?.readyState==='complete')await initialSync()});(async()=>{const {data}=await supabase.auth.getSession();session=data.session;showAuth();startWatch();if(session)setTimeout(initialSync,700)})();</script></body></html>
