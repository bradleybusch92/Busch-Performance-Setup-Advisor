<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<title>Abstraction Owner's Manual - Cloud Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090b0e;--panel:#13161a;--line:#353b44;--text:#f3f5f7;--muted:#a6adb6;--ok:#9bd5a5;--warn:#e2cb72;--bad:#ef9a9a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#101318;border-bottom:1px solid var(--line)}
.brand{font-weight:800}.spacer{flex:1}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
button,input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#1a1e23;color:var(--text)}button{cursor:pointer;touch-action:manipulation}.primary{background:#eceff2;color:#111418;border-color:#eceff2;font-weight:800}
.auth{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.auth input{width:210px}.email{font-size:12px;color:#d5dbe1}.frame{width:100%;height:calc(100vh - 59px);border:0;display:block;background:#090b0e}
.toast{position:fixed;right:14px;bottom:14px;z-index:50;background:#11151a;border:1px solid #58616c;padding:10px 13px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;max-width:min(460px,calc(100vw - 28px))}.toast.show{opacity:1}
@media(max-width:720px){.bar{align-items:stretch}.spacer{display:none}.auth{width:100%}.auth input{flex:1;min-width:0}.frame{height:calc(100vh - 117px)}}
@media(max-width:480px){.auth input{width:100%;flex-basis:100%}.frame{height:calc(100vh - 157px)}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Abstraction Owner's Manual</div>
  <div id="syncStatus" class="status warn">Starting cloud sync…</div>
  <div class="spacer"></div>
  <div id="signedIn" class="auth" style="display:none">
    <span id="userEmail" class="email"></span>
    <button id="syncNow" type="button">Sync Now</button>
    <button id="signOut" type="button">Sign Out</button>
  </div>
  <div id="signedOut" class="auth">
    <input id="email" type="email" autocomplete="username" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="signIn" type="button" class="primary">Sign In</button>
    <button id="signUp" type="button">Create Account</button>
  </div>
</div>
<iframe id="app" class="frame" src="index.html" title="Abstraction Owner's Manual"></iframe>
<div id="toast" class="toast"></div>
<script>
(function(){
  'use strict';

  const SB_URL='https://gjlhegrcmaclikeoeonh.supabase.co';
  const SB_KEY='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9';
  const APP_KEY='abstractionOwnersManualWebV1';
  const $=id=>document.getElementById(id);

  let client=null;
  let session=null;
  let lastLocal=null;
  let lastRemoteUpdated=null;
  let pushing=false;
  let pushDelay=null;
  let localTimer=null;
  let remoteTimer=null;

  function toast(msg){
    $('toast').textContent=msg;
    $('toast').classList.add('show');
    setTimeout(()=>$('toast').classList.remove('show'),3200);
  }

  function status(msg,cls=''){
    $('syncStatus').textContent=msg;
    $('syncStatus').className='status '+cls;
  }

  function frameStorage(){
    try{return $('app').contentWindow.localStorage}catch(e){return null}
  }

  function getLocalRaw(){
    const s=frameStorage();
    return s ? s.getItem(APP_KEY) : null;
  }

  function setLocalRaw(raw){
    const s=frameStorage();
    if(!s)return false;
    s.setItem(APP_KEY,raw);
    return true;
  }

  function showAuth(){
    if(session){
      $('signedOut').style.display='none';
      $('signedIn').style.display='flex';
      $('userEmail').textContent=session.user?.email || 'Signed in';
    }else{
      $('signedOut').style.display='flex';
      $('signedIn').style.display='none';
      status('Not signed in','warn');
    }
  }

  async function pushRaw(raw,force=false){
    if(!client||!session||!raw||pushing)return;
    if(!force && raw===lastLocal)return;
    pushing=true;
    status('Saving to cloud…','warn');
    let parsed;
    try{parsed=JSON.parse(raw)}catch(e){
      pushing=false;
      status('Local data error','bad');
      toast('The local Owner\'s Manual data could not be read.');
      return;
    }
    const {data,error}=await client
      .from('owner_manuals')
      .upsert({user_id:session.user.id,state:parsed},{onConflict:'user_id'})
      .select('updated_at')
      .single();
    pushing=false;
    if(error){
      status('Cloud save failed','bad');
      toast('Cloud save failed: '+error.message);
      return;
    }
    lastLocal=raw;
    lastRemoteUpdated=data?.updated_at || null;
    status('Synced','ok');
  }

  async function initialSync(){
    if(!client||!session)return;
    status('Checking cloud…','warn');
    const {data,error}=await client
      .from('owner_manuals')
      .select('state,updated_at')
      .eq('user_id',session.user.id)
      .maybeSingle();
    if(error){
      status('Cloud read failed','bad');
      toast('Cloud read failed: '+error.message);
      return;
    }
    const localRaw=getLocalRaw();
    if(data?.state){
      const cloudRaw=JSON.stringify(data.state);
      lastRemoteUpdated=data.updated_at;
      lastLocal=cloudRaw;
      if(localRaw!==cloudRaw){
        setLocalRaw(cloudRaw);
        $('app').contentWindow.location.reload();
      }
      status('Synced','ok');
    }else if(localRaw){
      await pushRaw(localRaw,true);
    }else{
      status('Signed in - nothing to sync yet','warn');
    }
  }

  async function checkRemote(){
    if(!client||!session||pushing)return;
    const {data,error}=await client
      .from('owner_manuals')
      .select('state,updated_at')
      .eq('user_id',session.user.id)
      .maybeSingle();
    if(error||!data)return;
    if(lastRemoteUpdated && data.updated_at===lastRemoteUpdated)return;

    const localRaw=getLocalRaw();
    if(localRaw && lastLocal && localRaw!==lastLocal){
      await pushRaw(localRaw);
      return;
    }

    const remoteRaw=JSON.stringify(data.state);
    lastRemoteUpdated=data.updated_at;
    lastLocal=remoteRaw;
    if(localRaw!==remoteRaw){
      setLocalRaw(remoteRaw);
      $('app').contentWindow.location.reload();
      toast('Updated from cloud');
    }
    status('Synced','ok');
  }

  function startWatch(){
    clearInterval(localTimer);
    clearInterval(remoteTimer);
    localTimer=setInterval(()=>{
      if(!session)return;
      const raw=getLocalRaw();
      if(raw && raw!==lastLocal){
        clearTimeout(pushDelay);
        pushDelay=setTimeout(()=>pushRaw(raw),700);
      }
    },800);
    remoteTimer=setInterval(checkRemote,5000);
  }

  async function signIn(){
    const email=$('email').value.trim();
    const password=$('password').value;
    if(!email||!password){toast('Enter an email and password.');return;}
    status('Signing in…','warn');
    const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error){
      status('Sign in failed','bad');
      toast('Sign in failed: '+error.message);
      return;
    }
    session=data.session;
    showAuth();
    await initialSync();
  }

  async function signUp(){
    const email=$('email').value.trim();
    const password=$('password').value;
    if(!email||!password){toast('Enter an email and password.');return;}
    if(password.length<6){toast('Password must be at least 6 characters.');return;}
    status('Creating account…','warn');
    const redirectTo=location.origin+location.pathname;
    const {data,error}=await client.auth.signUp({
      email,
      password,
      options:{emailRedirectTo:redirectTo}
    });
    if(error){
      status('Account creation failed','bad');
      toast('Account creation failed: '+error.message);
      return;
    }
    if(data.session){
      session=data.session;
      showAuth();
      await initialSync();
      toast('Account created. Cloud sync is on.');
    }else{
      status('Check your email','warn');
      toast('Account created. Confirm the email, then return here and sign in.');
    }
  }

  async function boot(){
    try{
      if(!window.supabase || typeof window.supabase.createClient!=='function'){
        status('Cloud library failed to load','bad');
        toast('The Supabase library did not load. Refresh the page and try again.');
        return;
      }
      client=window.supabase.createClient(SB_URL,SB_KEY);

      $('signIn').addEventListener('click',signIn);
      $('signUp').addEventListener('click',signUp);
      $('signOut').addEventListener('click',async()=>{
        await client.auth.signOut();
        session=null;
        lastLocal=null;
        lastRemoteUpdated=null;
        showAuth();
        toast('Signed out. Local copy remains on this device.');
      });
      $('syncNow').addEventListener('click',async()=>{
        const raw=getLocalRaw();
        if(raw)await pushRaw(raw,true);
        await checkRemote();
      });
      $('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});

      client.auth.onAuthStateChange((event,newSession)=>{
        session=newSession;
        showAuth();
        if(session)setTimeout(initialSync,100);
      });

      const {data,error}=await client.auth.getSession();
      if(error){
        status('Authentication error','bad');
        toast(error.message);
      }else{
        session=data.session;
        showAuth();
        startWatch();
        if(session)setTimeout(initialSync,600);
      }
    }catch(err){
      console.error(err);
      status('Cloud setup error','bad');
      toast('Cloud setup error: '+(err?.message||String(err)));
    }
  }

  $('app').addEventListener('load',()=>{if(session)setTimeout(initialSync,200)});
  boot();
})();
</script>
</body>
</html>
