<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<title>Abstraction Owner's Manual - Cloud Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090b0e;--line:#353b44;--text:#f3f5f7;--muted:#a6adb6;--ok:#9bd5a5;--warn:#e2cb72;--bad:#ef9a9a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{flex:0 0 auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:5px 7px;background:rgba(9,11,14,.97);border-bottom:1px solid var(--line);z-index:50;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}.topbar.loggedIn{flex-wrap:nowrap}
.navGroup,.auth{display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.spacer{flex:1;min-width:4px}
button,input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#1a1e23;color:var(--text);min-height:30px;font-size:12px}
button{cursor:pointer;touch-action:manipulation}
button.primary,.navBtn.active{background:#eceff2;color:#111418;border-color:#eceff2;font-weight:800}
.navBtn{border-radius:999px;background:transparent;color:#a6adb6;white-space:nowrap}
.status{font-size:11px;color:var(--muted);white-space:nowrap}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
.auth input{width:190px}
.frame{flex:1 1 auto;min-height:0;width:100%;border:0;display:block;background:#090b0e}
.toast{position:fixed;right:14px;bottom:14px;z-index:80;background:#11151a;border:1px solid #58616c;padding:10px 13px;border-radius:8px;opacity:0;transition:.18s;pointer-events:none;max-width:min(460px,calc(100vw - 28px))}.toast.show{opacity:1}
@media(max-width:760px){.topbar.loggedIn{align-items:center;overflow-x:auto}.topbar.loggedIn .navGroup{width:auto;overflow:visible}.topbar.loggedIn .spacer{display:none}.topbar.loggedIn .status{display:none}.topbar.loggedIn .auth{width:auto;margin-left:auto}.topbar:not(.loggedIn){align-items:stretch}.topbar:not(.loggedIn) .navGroup{width:100%;overflow-x:auto}.topbar:not(.loggedIn) .spacer{display:none}.topbar:not(.loggedIn) .auth{width:100%}.auth input{flex:1;min-width:0}}
@media(max-width:500px){.topbar.loggedIn button{font-size:11px;padding:4px 6px;min-height:28px}.topbar:not(.loggedIn) .auth input{width:100%;flex-basis:100%}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
  <div class="navGroup" id="outerNav">
    <button class="navBtn active" type="button" data-page="visual">Visual Car</button>
    <button class="navBtn" type="button" data-page="systems">Systems</button>
    <button class="navBtn" type="button" data-page="index">Component Index</button>
  </div>
  <div id="syncStatus" class="status warn">Starting cloud sync…</div>
  <div class="spacer"></div>
  <div id="signedIn" class="auth" style="display:none">
    <button id="syncNow" type="button">Sync Now</button>
    <button id="signOut" type="button">Sign Out</button>
  </div>
  <div id="signedOut" class="auth">
    <input id="email" type="email" autocomplete="username" placeholder="Email">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="signIn" type="button" class="primary">Sign In</button>
    <button id="signUp" type="button">Create Account</button>
  </div>
</div>
<iframe id="app" class="frame" src="index.html?v=20260929-1945" title="Abstraction Owner's Manual"></iframe>
<div id="toast" class="toast"></div>
<script>
(function(){
  'use strict';
  const SB_URL='https://gjlhegrcmaclikeoeonh.supabase.co';
  const SB_KEY='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9';
  const APP_KEY='abstractionOwnersManualWebV1';
  const LOGO_URL='abstraction-logo-white.svg?v=20260929-1915';
  const $=id=>document.getElementById(id);
  let client=null,session=null,lastLocal=null,lastRemoteUpdated=null,pushing=false,pushDelay=null,localTimer=null,remoteTimer=null;

  function toast(msg,duration=3200){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),duration)}
  function status(msg,cls=''){$('syncStatus').textContent=msg;$('syncStatus').className='status '+cls}
  function setOuterActive(page){document.querySelectorAll('#outerNav .navBtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}

  async function saveSetupAndReturn(doc,win){
    const saveBtn=doc.getElementById('cloudSetupSave');
    try{if(doc.activeElement&&typeof doc.activeElement.blur==='function')doc.activeElement.blur()}catch(e){}
    if(saveBtn){saveBtn.disabled=true;saveBtn.textContent='Saving…'}
    let ok=true;
    const raw=getLocalRaw();
    if(session&&raw){
      while(pushing)await new Promise(resolve=>setTimeout(resolve,80));
      ok=await pushRaw(raw,true);
    }
    if(!ok){
      if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Save'}
      return;
    }
    const confirm=doc.getElementById('cloudSaveConfirm');
    if(confirm){confirm.textContent='✓ Saved';confirm.classList.add('show')}
    toast('✓ Setup saved',1400);
    await new Promise(resolve=>setTimeout(resolve,650));
    doc.body.classList.remove('cloudFieldEditMode');
    try{
      if(win&&typeof win.show==='function')win.show('visual');
      const area=doc.getElementById('area');if(area)area.classList.add('hidden');
      const home=doc.getElementById('home');if(home)home.classList.remove('hidden');
      if(win&&typeof win.scrollTo==='function')win.scrollTo(0,0);
    }catch(e){}
    setOuterActive('visual');
    if(confirm)confirm.classList.remove('show');
    if(saveBtn){saveBtn.disabled=false;saveBtn.textContent='Save'}
  }

  function ensureSetupFieldEditor(doc,win){
    const pane=doc.getElementById('setupPane');
    if(!pane)return;
    let controls=doc.getElementById('cloudFieldEditControls');
    if(!controls){
      controls=doc.createElement('div');
      controls.id='cloudFieldEditControls';
      controls.innerHTML='<span id="cloudSaveConfirm" aria-live="polite"></span><div class="cloudSetupActions"><button type="button" class="btn" id="cloudFieldEditToggle">Edit Fields</button><button type="button" class="btn primary" id="cloudSetupSave">Save</button></div>';
      pane.appendChild(controls);
      const btn=doc.getElementById('cloudFieldEditToggle');
      btn.addEventListener('click',()=>{
        const editing=!doc.body.classList.contains('cloudFieldEditMode');
        doc.body.classList.toggle('cloudFieldEditMode',editing);
        btn.textContent=editing?'Done Editing':'Edit Fields';
      });
      const saveBtn=doc.getElementById('cloudSetupSave');
      saveBtn.addEventListener('click',()=>saveSetupAndReturn(doc,win));
    }
    const btn=doc.getElementById('cloudFieldEditToggle');
    if(btn)btn.textContent=doc.body.classList.contains('cloudFieldEditMode')?'Done Editing':'Edit Fields';
  }

  function customizeInner(){
    try{
      const frame=$('app'),doc=frame.contentDocument,win=frame.contentWindow;
      if(!doc)return;
      const header=doc.querySelector('header');
      if(header){
        const left=header.firstElementChild;
        if(left){
          const oldTitle=left.querySelector('h1'); if(oldTitle) oldTitle.style.display='none';
          const oldSub=left.querySelector('.sub'); if(oldSub) oldSub.style.display='none';
          const oldRed=left.querySelector('.red'); if(oldRed) oldRed.style.display='none';
          let block=doc.getElementById('cloudBrandBlock');
          if(!block){
            block=doc.createElement('div');block.id='cloudBrandBlock';
            block.innerHTML='<img id="cloudBrandLogo" alt="Busch Performance Abstraction Chassis"><div id="cloudInnerEmail"></div>';
            left.insertBefore(block,left.firstChild);
          }
          const img=doc.getElementById('cloudBrandLogo');if(img)img.src=LOGO_URL;
          const email=doc.getElementById('cloudInnerEmail');if(email)email.textContent=session&&session.user&&session.user.email?session.user.email:'Not signed in';
        }
      }
      const innerNav=doc.querySelector('.nav'); if(innerNav)innerNav.style.display='none';
      if(!doc.getElementById('cloudHeaderStyles')){
        const st=doc.createElement('style');st.id='cloudHeaderStyles';st.textContent=`
          #cloudBrandBlock{width:min(760px,92vw)}
          #cloudBrandLogo{display:block;width:100%;height:auto;max-height:255px;object-fit:contain;object-position:left center}
          #cloudInnerEmail{margin-top:4px;color:#a6adb6;font-size:12px}
          body:not(.cloudFieldEditMode) #setupPane .x,body:not(.cloudFieldEditMode) #setupPane .add{display:none!important}
          #setupPane .setupGrid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))!important;gap:8px!important}
          #setupPane .row{display:flex!important;position:relative;flex-direction:column;align-items:stretch!important;gap:4px!important;padding:7px 8px!important;border:1px solid #292e35!important;border-radius:8px;background:#0f1216;min-width:0}
          #setupPane .row label{display:block;font-size:11px!important;line-height:1.15;min-height:25px;color:#d9dee4}
          #setupPane .row input{width:100%!important;min-width:0;padding:7px 8px!important;min-height:34px}
          body.cloudFieldEditMode #setupPane .row{padding-right:41px!important}
          body.cloudFieldEditMode #setupPane .row .x{display:block!important;position:absolute;right:6px;top:6px;width:28px!important;height:28px!important;min-height:28px!important;padding:0!important}
          #cloudFieldEditControls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid #292e35}
          .cloudSetupActions{display:flex;gap:7px;align-items:center;margin-left:auto}
          #cloudFieldEditToggle{min-width:105px}
          #cloudSetupSave{min-width:78px}
          #cloudSaveConfirm{color:#9bd5a5;font-weight:800;opacity:0;transform:translateY(2px);transition:opacity .15s ease,transform .15s ease;white-space:nowrap}
          #cloudSaveConfirm.show{opacity:1;transform:translateY(0)}
          @media(max-width:650px){
            html,body{max-width:100%!important;overflow-x:hidden!important}
            .shell{max-width:100%!important;overflow-x:hidden!important}
            #cloudBrandBlock{width:min(100%,680px)} #cloudBrandLogo{max-height:190px}
            #setupPane .setupGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}
            #setupPane .row{padding:6px!important;min-width:0!important}
            #setupPane .row label{font-size:10.5px!important;min-height:27px}
            #setupPane .row input{padding:6px 7px!important;min-height:34px;font-size:16px!important;max-width:100%!important}
            #setupPane input,#setupPane select,#setupPane textarea{font-size:16px!important}
            body.cloudFieldEditMode #setupPane .row{padding-right:39px!important}
            #cloudFieldEditControls{position:relative;flex-wrap:nowrap}
            .cloudSetupActions{gap:6px}
          }
          @media(max-width:350px){#setupPane .setupGrid{grid-template-columns:1fr!important}}
        `;doc.head.appendChild(st);
      }
      ensureSetupFieldEditor(doc,win);
      if(win && !win.__cloudSetupObserver){
        const pane=doc.getElementById('setupPane');
        if(pane){
          win.__cloudSetupObserver=new win.MutationObserver(()=>setTimeout(()=>ensureSetupFieldEditor(doc,win),0));
          win.__cloudSetupObserver.observe(pane,{childList:true});
        }
      }
      if(win && typeof win.show==='function' && !win.__cloudShowWrapped){
        const original=win.show;
        win.show=function(page){const r=original.apply(this,arguments);setOuterActive(page);return r;};
        win.__cloudShowWrapped=true;
      }
    }catch(e){console.warn('Header customization failed',e)}
  }

  function navigateInner(page){
    setOuterActive(page);
    try{
      const frame=$('app'),win=frame.contentWindow,doc=frame.contentDocument;
      if(win&&typeof win.show==='function'){win.show(page);return;}
      const btn=doc&&doc.querySelector('.nav button[data-page="'+page+'"]');if(btn)btn.click();
    }catch(e){}
  }

  function frameStorage(){try{return $('app').contentWindow.localStorage}catch(e){return null}}
  function getLocalRaw(){const s=frameStorage();return s?s.getItem(APP_KEY):null}
  function setLocalRaw(raw){const s=frameStorage();if(!s)return false;s.setItem(APP_KEY,raw);return true}

  function showAuth(){
    $('topbar').classList.toggle('loggedIn',!!session);
    if(session){$('signedOut').style.display='none';$('signedIn').style.display='flex';}
    else{$('signedOut').style.display='flex';$('signedIn').style.display='none';status('Not signed in','warn')}
    customizeInner();
  }

  async function pushRaw(raw,force=false){
    if(!client||!session||!raw)return false;if(pushing)return false;if(!force&&raw===lastLocal)return true;
    pushing=true;status('Saving to cloud…','warn');let parsed;
    try{parsed=JSON.parse(raw)}catch(e){pushing=false;status('Local data error','bad');toast("The local Owner's Manual data could not be read.");return false}
    const {data,error}=await client.from('owner_manuals').upsert({user_id:session.user.id,state:parsed},{onConflict:'user_id'}).select('updated_at').single();
    pushing=false;
    if(error){status('Cloud save failed','bad');toast('Cloud save failed: '+error.message);return false}
    lastLocal=raw;lastRemoteUpdated=data&&data.updated_at?data.updated_at:null;status('Synced','ok');return true;
  }

  async function initialSync(){
    if(!client||!session)return;status('Checking cloud…','warn');
    const {data,error}=await client.from('owner_manuals').select('state,updated_at').eq('user_id',session.user.id).maybeSingle();
    if(error){status('Cloud read failed','bad');toast('Cloud read failed: '+error.message);return}
    const localRaw=getLocalRaw();
    if(data&&data.state){
      const cloudRaw=JSON.stringify(data.state);lastRemoteUpdated=data.updated_at;lastLocal=cloudRaw;
      if(localRaw!==cloudRaw){setLocalRaw(cloudRaw);$('app').contentWindow.location.reload();}
      status('Synced','ok');
    }else if(localRaw){await pushRaw(localRaw,true)}else{status('Signed in - nothing to sync yet','warn')}
  }

  async function checkRemote(){
    if(!client||!session||pushing)return;
    const {data,error}=await client.from('owner_manuals').select('state,updated_at').eq('user_id',session.user.id).maybeSingle();
    if(error||!data)return;if(lastRemoteUpdated&&data.updated_at===lastRemoteUpdated)return;
    const localRaw=getLocalRaw();
    if(localRaw&&lastLocal&&localRaw!==lastLocal){await pushRaw(localRaw);return}
    const remoteRaw=JSON.stringify(data.state);lastRemoteUpdated=data.updated_at;lastLocal=remoteRaw;
    if(localRaw!==remoteRaw){setLocalRaw(remoteRaw);$('app').contentWindow.location.reload();toast('Updated from cloud')}
    status('Synced','ok');
  }

  function startWatch(){
    clearInterval(localTimer);clearInterval(remoteTimer);
    localTimer=setInterval(()=>{if(!session)return;const raw=getLocalRaw();if(raw&&raw!==lastLocal){clearTimeout(pushDelay);pushDelay=setTimeout(()=>pushRaw(raw),700)}},800);
    remoteTimer=setInterval(checkRemote,5000);
  }

  async function signIn(){
    const email=$('email').value.trim(),password=$('password').value;if(!email||!password){toast('Enter an email and password.');return}
    status('Signing in…','warn');const {data,error}=await client.auth.signInWithPassword({email,password});
    if(error){status('Sign in failed','bad');toast('Sign in failed: '+error.message);return}
    session=data.session;showAuth();await initialSync();
  }

  async function signUp(){
    const email=$('email').value.trim(),password=$('password').value;if(!email||!password){toast('Enter an email and password.');return}if(password.length<6){toast('Password must be at least 6 characters.');return}
    status('Creating account…','warn');const redirectTo=location.origin+location.pathname;
    const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}});
    if(error){status('Account creation failed','bad');toast('Account creation failed: '+error.message);return}
    if(data.session){session=data.session;showAuth();await initialSync();toast('Account created. Cloud sync is on.')}else{status('Check your email','warn');toast('Account created. Confirm the email, then return here and sign in.')}
  }

  async function boot(){
    try{
      if(!window.supabase||typeof window.supabase.createClient!=='function'){status('Cloud library failed to load','bad');toast('The Supabase library did not load. Refresh the page and try again.');return}
      client=window.supabase.createClient(SB_URL,SB_KEY);
      document.querySelectorAll('#outerNav .navBtn').forEach(b=>b.addEventListener('click',()=>navigateInner(b.dataset.page)));
      $('signIn').addEventListener('click',signIn);$('signUp').addEventListener('click',signUp);
      $('signOut').addEventListener('click',async()=>{await client.auth.signOut();session=null;lastLocal=null;lastRemoteUpdated=null;showAuth();toast('Signed out. Local copy remains on this device.')});
      $('syncNow').addEventListener('click',async()=>{const raw=getLocalRaw();if(raw)await pushRaw(raw,true);await checkRemote()});
      $('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
      client.auth.onAuthStateChange((event,newSession)=>{session=newSession;showAuth();if(session)setTimeout(initialSync,100)});
      const {data,error}=await client.auth.getSession();
      if(error){status('Authentication error','bad');toast(error.message)}else{session=data.session;showAuth();startWatch();if(session)setTimeout(initialSync,600)}
    }catch(err){console.error(err);status('Cloud setup error','bad');toast('Cloud setup error: '+(err&&err.message?err.message:String(err)))}
  }

  $('app').addEventListener('load',()=>{customizeInner();if(session)setTimeout(initialSync,200)});
  boot();
})();
</script>
</body>
</html>
