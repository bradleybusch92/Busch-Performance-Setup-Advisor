<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abstraction Diagnostic v2</title>
<style>html,body{margin:0;background:#161616;color:#f2f2f2;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}main{max-width:720px;margin:30px auto;padding:18px}.card{border:1px solid #444;background:#1d1d1d;border-radius:10px;padding:16px}.row{padding:8px 0;border-bottom:1px solid #333}.row:last-child{border-bottom:0}.ok{color:#b7e3b7}.bad{color:#ffaaaa}.wait{color:#ccc}</style>
</head><body><main><div class="card"><h2 style="margin-top:0">Abstraction Diagnostic v2</h2><div id="html" class="row ok">1. HTML loaded</div><div id="js" class="row wait">2. JavaScript waiting…</div><div id="local" class="row wait">3. Local browser cache waiting…</div><div id="shell" class="row wait">4. index.html fetch waiting…</div><div id="cdn" class="row wait">5. Supabase library waiting…</div><div id="auth" class="row wait">6. Supabase session check waiting…</div><div id="rpc" class="row wait">7. Cloud RPC waiting…</div></div></main>
<script>
(function(){
'use strict';
const set=(id,text,ok)=>{const e=document.getElementById(id);e.textContent=text;e.className='row '+(ok===true?'ok':ok===false?'bad':'wait')};
set('js','2. JavaScript running',true);
try{const raw=localStorage.getItem('abstractionOwnersManualWebV1');if(!raw)set('local','3. Local browser cache: none found',null);else{const x=JSON.parse(raw);const n=Array.isArray(x.components)?x.components.length:'unknown';set('local','3. Local browser cache component count: '+n,true)}}catch(e){set('local','3. Local browser cache could not be read: '+e.message,false)}
fetch('index.html?diag='+Date.now(),{cache:'no-store'}).then(r=>{set('shell','4. index.html fetch: HTTP '+r.status+(r.ok?' OK':' FAIL'),r.ok);return r.text()}).then(t=>{if(t)document.getElementById('shell').textContent+=' ('+t.length+' bytes)'}).catch(e=>set('shell','4. index.html fetch failed: '+e.message,false));
const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=async()=>{set('cdn','5. Supabase library loaded',true);try{const url='https://gjlhegrcmaclikeoeonh.supabase.co';const key='sb_publishable_bh-dXv2tB7j-VH9qqTih6g_BAK5GCH9';const c=window.supabase.createClient(url,key);const {data,error}=await c.auth.getSession();if(error)throw error;const sess=data&&data.session;set('auth','6. Supabase session check: '+(sess?'signed in':'no active session'),true);if(!sess){set('rpc','7. Cloud RPC skipped because there is no active session',null);return}const r=await fetch(url+'/rest/v1/rpc/get_owner_manual_state',{method:'POST',cache:'no-store',headers:{apikey:key,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json',Accept:'application/json'},body:'{}'});if(!r.ok){set('rpc','7. Cloud RPC: HTTP '+r.status+' FAIL',false);return}const rows=await r.json();const st=rows&&rows[0]&&rows[0].state;const n=st&&Array.isArray(st.components)?st.components.length:'unknown';set('rpc','7. Cloud RPC: HTTP 200 OK; cloud component count: '+n,true)}catch(e){set('auth','6. Supabase/session error: '+e.message,false);set('rpc','7. Cloud RPC not reached',false)}};
s.onerror=()=>{set('cdn','5. Supabase library failed to load',false);set('auth','6. Session check not reached',false);set('rpc','7. Cloud RPC not reached',false)};document.head.appendChild(s);setTimeout(()=>{if(document.getElementById('cdn').classList.contains('wait'))set('cdn','5. Supabase library still not loaded after 8 seconds',false)},8000);
})();
</script></body></html>
